# 指定ページの文面を取ってログに出す単発実行ツール。
# 開発環境からは外部サイトに届かないため、Actionsから読む。
# url を省略すると自店のダッシュボードを読む。
name: dashboard-snapshot
on:
  workflow_dispatch:
    inputs:
      url:
        description: "読むページのURL"
        required: false
        default: "https://shipporitei.jp/dashboard/"
        type: string
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ inputs.url }}
        run: |
          curl -sL "$URL" | python3 -c '
          import sys, re
          h = sys.stdin.read()
          h = re.sub(r"<(script|style).*?</\1>", "", h, flags=re.S)
          h = re.sub(r"<[^>]+>", "\n", h)
          lines = [l.strip() for l in h.split("\n") if l.strip()]
          print("\n".join(lines))
          '
