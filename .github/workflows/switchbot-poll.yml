# 冷蔵庫・冷凍庫の温度計（SwitchBot）を読む（店舗管理アプリ /api/cron/switchbot）・手動の予備だけ。
# 2026-11-09〜 30分ごとの呼び出しは Supabase の定期実行（pg_cron・shippori-reserve の 0077）に移した。
# GitHub の定期実行は夜間に2〜4時間とぶことがあったため（11/9 0:10→3:48→7:46）。二重に読まないよう schedule は外す。
# 合言葉は予約インサイトと同じ RESERVE_INSIGHTS_TOKEN（アプリの INSIGHTS_TOKEN）。レスポンスに個人情報は含まれない。
name: switchbot-poll
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          TOKEN: ${{ secrets.RESERVE_INSIGHTS_TOKEN }}
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -H "x-api-key: ${TOKEN}" \
            https://yoyaku.shipporitei.jp/api/cron/switchbot
